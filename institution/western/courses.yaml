fetch:
  url: https://studentservices.uwo.ca/secure/timetables/mastertt/ttindex.cfm
  method: POST
  fields:
    subject: '{subject}'
    catalognbr: '{number}'
    Designation: Any
    CourseTime: All
    Component: All
    LocationCode: Any
    command: search
  parser: timetable_tables
  limits: Read on 2026-11-07. The public master timetable (Undergraduate Fall/Winter Academic Timetable
    2026/2027) returns, per section, the section number, component (LEC, LAB, TUT), class number, requisites,
    status, campus and delivery type. It does not show meeting days, times or rooms; those are in the
    Student Center after registration and are not on a public page the clerk may read. So the clerk can
    say which sections a course has and whether they are full; asked when or where a course meets, it
    answers Unknown and names the timetable page as the nearest fact. The subject code is the timetable's
    own (BIOCHEM, COMPSCI, ...), the course number is the four digits without the suffix, and the fetch
    is one POST per course.
