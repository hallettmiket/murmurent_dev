# Western's tier of the funder registry (docs/funders.md), read by the
# prospector before any other tier. Not in the public release. Filled
# 2026-11-12 from public pages on schulich.uwo.ca and uwo.ca; nothing behind
# a login was read. Every entry carries its page and the date read.
internal_deadline:
  rule: Standard applications must reach Western Research no fewer than five business days before the sponsor's deadline; large-volume Tri-Agency competitions a minimum of ten business days, and a Tri-Agency application newly received two business days before the external deadline is not forwarded.
  working_days: -5          # standard; the page says "business days"
  by:
    tri_agency: -10
    partner_contributions: -15    # "a minimum of three weeks before the anticipated submission date"
    us_federal: -20               # "a minimum of four weeks is recommended"
  relative_to: sponsor_deadline
  note: Every application also needs a ROLA proposal, which the PI starts at least one week before the internal deadline (ROLA process page, read 2026-11-12). Some faculties publish their own, different numbers; read the faculty's page for a faculty-level rule.
  source: http://www.uwo.ca/research/policies/institutional-signatures.html
  date_read: 2026-11-12
