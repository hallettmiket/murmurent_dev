colour_rules:
- Purple and white are primary and are used liberally (backgrounds, headlines, text containers).
- Orchid and Deep Focus may be used with Western Purple to add depth.
- Purple is always the primary colour; accent colours are limited to small elements.
fonts:
- name: Benton Sans
  role: primary
  weights: Book for body copy; Bold for headers, sub-heads and callouts, never whole paragraphs
  source: https://brand.westernu.ca/visual-identity/typography.html
  date_read: '2026-11-07'
- name: Tahoma
  role: system alternative to Benton Sans
  weights: Regular
  source: https://brand.westernu.ca/visual-identity/typography.html
  date_read: '2026-11-07'
- name: Tiempos Headline
  role: accent
  weights: Regular; pull quotes and emphasis only, never body copy
  source: https://brand.westernu.ca/visual-identity/typography.html
  date_read: '2026-11-07'
- name: Georgia
  role: system alternative to Tiempos Headline
  weights: Regular
  source: https://brand.westernu.ca/visual-identity/typography.html
  date_read: '2026-11-07'
