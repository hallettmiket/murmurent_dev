# Release allowlist for the public murmurent repo
#
# Nothing reaches the public repo unless a rule here says it may. A path that
# matches no rule is an ERROR, not a default-ship and not a default-drop:
# `python3 release/check_allowlist.py` fails, and the release stops until a
# person classifies it.
#
# That is deliberate. A denylist of "things not to publish" ships the next
# internal file someone adds, silently, because nothing about it is wrong.
# This repo's own rule, from inhibition's docs/how_this_project_breaks.md:
# "Name what passes, never what fails. An allowlist refuses a value nobody
# anticipated; a denylist admits it."
#
# Prefixes ending in / match a whole subtree. Everything else is an exact path.

ship:
  # --- the system itself -----------------------------------------------
  - agents/                 # the commons; the public release is these
  - rules/                  # auto-loaded hard rules
  - skills/                 # user-invocable slash commands
  - src/                    # the murmurent package
  - scripts/                # setup.sh, bootstrap.sh, install helpers
  - templates/              # scaffolding written into new repos
  - instruments/            # instrument descriptors
  - tests/                  # see DECIDE-1
  - .github/                # issue template + docs workflow

  # --- packaging and site ----------------------------------------------
  - pyproject.toml
  - uv.lock
  - mkdocs.yml              # NOTE: its exclude_docs list must be kept in step
  - overrides/              # mkdocs theme overrides
  - .gitignore
  - Open Dashboard.command

  # --- front matter ------------------------------------------------------
  - README.md
  - LICENSE                 # Apache-2.0, already in place
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - TUTORIAL.md
  - TROUBLESHOOTING.md
  - CLAUDE.md               # see DECIDE-2

  # --- branding actually used by the app --------------------------------
  - assets/murmurent_app_icon.png
  - assets/murmurent_app_icon.py
  - assets/murmurent_uniform_wordmark.html

  # --- documentation ------------------------------------------------------
  # The 53 pages in the mkdocs nav, plus the four below that the runtime
  # needs. Everything else under docs/ is named in `withhold` or `decide`.
  - docs/                   # subtree, minus the withhold entries under it

  # --- EDID material: looks internal, is a runtime dependency -----------
  # Verified against the code before classifying; do not "tidy" these away.
  - docs/edid_resources.md        # agents/conscience.md reads it before flagging
  - docs/edid_gap_decisions.md    # hooks/conscience_gaps.py: DECISIONS_NAME
  - docs/edid_pdfs/               # conscience reads local full texts here
  - docs/conscience_persona.md    # agents/conscience.md links it as the argument

withhold:
  # --- internal planning, already marked internal in mkdocs exclude_docs ---
  - docs/backlog.md
  - docs/implementation_prompt.md
  - docs/implementation_prompt_phase_1_foundation.md
  - docs/implementation_prompt_phase_2_project_experiment.md
  - docs/implementation_prompt_phase_3_push_sea.md
  - docs/implementation_prompt_phase_4_mcp_hooks.md
  - docs/implementation_prompt_phase_5_dashboard_tutorial.md
  - docs/cores_smoke_runbook.md
  - docs/designer_dashboard/      # hi-fi mockups, wireframes, HANDOFF.md
  - docs/diagrams/README.md

  # --- internal test runbooks (not in the nav, no runtime use) ----------
  - docs/keyring_server_test.md
  - docs/keyring_two_laptop_test.md

  # --- agent working artefacts ------------------------------------------
  - outputs/                # bookworm scratch, incl. the project-rename research

  # --- per-machine config, not portable ----------------------------------
  - .claude/                # contains /Users/mth/... paths and chair_renewal refs
  - .vscode/

  # --- institutional and grant documents, must not ship ------------------
  - assets/chair_renewal_1.3.pdf
  - assets/2026_Schulich_WRC_Performance_Report_Template_19Mar2026_V1.docx
  - assets/2026_Schulich_WRC_Research_Program_Template_19Mar2026_V1.docx
  - assets/Untitled Bibliography.rtf

decide:
  # Real judgement calls. The checker treats these as UNRESOLVED and fails
  # until each is moved into ship or withhold by a person.

  - path: tests/
    id: DECIDE-1
    question: >
      Ship the 194 test files? For a research tool they are evidence the thing
      works and they help outside contributors. They also reference internal
      fixtures and paths. Shipping is the default above; overrule if unwanted.

  - path: CLAUDE.md
    id: DECIDE-2
    question: >
      CLAUDE.md is how a Claude Code session learns what murmurent is, so the
      public release probably needs one. The current file names internal repos
      (/data/lab_vm, the lab_mgmt naming, the manuscript repo). Likely a
      released variant rather than a straight copy or a deletion.

  - path: docs/cores_plan.md
    id: DECIDE-3
    question: >
      Marked internal in mkdocs exclude_docs, but eight source files cite it in
      docstrings as the schema reference (contract.py, services.py,
      registrar.py, invoices.py, calendar_google.py, security_tier2.py,
      service_requests.py, server.py). Withholding leaves eight dangling
      references in shipped code. Ship it, or strip the citations.

  - path: docs/murmurent_public/
    id: DECIDE-4
    question: >
      Hub scaffolding: install-murmurent.sh, the join scripts, and
      join/directory.tsv. Excluded from the rendered site. Check whether
      directory.tsv carries real institution entries before shipping.

  - path: assets/mustang_logo.jpg
    id: DECIDE-5
    question: Western mascot. Institution-specific branding, see DECIDE-6.

  - path: docs/assets/logos/
    id: DECIDE-6
    question: >
      Schulich_horizontal_CMYK.png, western_longWhite.png, lab-logo-hi-res.jpg.
      CLAUDE.md's own rule is that deployments stay institution-agnostic and
      never hardcode a university. These are Western/Schulich marks in the
      default docs theme, which another centre would inherit. Replace with
      neutral placeholders, or accept that the reference deployment is branded.
